# nginx — Mac 2 edge / reverse proxy / load balancer
# Symlink or include from nginx.conf, e.g.:
#   include /path/to/CN-project-Newbugs/edge/team.conf;
#
# Replace BACKEND_A_IP, BACKEND_B_IP, and teamX.
# Prefer :443; if privileged ports are blocked use 8443 and update listen.

upstream team_backends {
    # Round-robin (default). Phase 2 HA: max_fails / fail_timeout.
    server BACKEND_A_IP:3001 max_fails=2 fail_timeout=10s;
    server BACKEND_B_IP:3002 max_fails=2 fail_timeout=10s;
}

# Redirect HTTP → HTTPS (optional if you also listen on 80/8080)
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # http2 on;   # uncomment if your nginx build supports it
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /usr/local/etc/nginx/certs/teamX.crt;
    ssl_certificate_key /usr/local/etc/nginx/certs/teamX.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://team_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Surface which upstream answered (also set by the app as X-Backend)
        add_header X-Edge "nginx-teamX" always;
    }
}
