# STANDBY edge (Mac 4: Khushi) - same config as Mac 2, different X-Edge header
log_format lb '$remote_addr:$remote_port "$request" $status '
              'upstream=$upstream_addr up_status=$upstream_status rt=$upstream_response_time';

upstream newbugs_backends {
    server 10.18.5.184:3001 max_fails=2 fail_timeout=10s;   # Backend A (Mac 3, Manjeet)
    server 10.18.5.186:3002 max_fails=2 fail_timeout=10s;   # Backend B (Mac 4, Khushi)
    keepalive 16;
}

server {
    listen 80;
    server_name app.newbugs.test api.newbugs.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.newbugs.test api.newbugs.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/app.newbugs.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.newbugs.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/newbugs_access.log lb;
    error_log  /opt/homebrew/var/log/nginx/newbugs_error.log warn;

    location / {
        proxy_pass http://newbugs_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Edge "mac4-standby" always;
    }
}
