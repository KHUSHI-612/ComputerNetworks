# ---- Newbugs private DNS (Mac 1: Shivam) ----
# Answer on Wi-Fi and loopback, whatever IP en0 currently has
interface=en0
interface=lo0

# Ignore /etc/resolv.conf; forward all other names to public DNS
no-resolv
server=1.1.1.1
server=8.8.8.8

# Our private zone: never forwarded to the internet
local=/newbugs.test/
domain-needed
bogus-priv

# A records: both names point to the edge (Mac 2, Divya)
host-record=app.newbugs.test,10.7.18.63
host-record=api.newbugs.test,10.7.18.63

# TTL (seconds) on our answers, visible in dig
local-ttl=60

# Log every query for evidence and debugging
log-queries
log-facility=/tmp/dnsmasq.log