# dnsmasq — Mac 1 private DNS
# Install: brew install dnsmasq
# Replace EDGE_IP and teamX before use.

# Do not read /etc/resolv.conf for upstream; this is a private zone only.
no-resolv
no-hosts

# Listen on all interfaces (LAN clients must reach UDP/TCP 53)
listen-address=0.0.0.0
bind-interfaces
port=53

# Short TTL for Phase 2 TTL demos (seconds)
local-ttl=30

# Private zone — .test (never use .local on macOS)
address=/app.teamX.test/EDGE_IP
address=/api.teamX.test/EDGE_IP

# Optional: log queries during demos
log-queries
log-facility=/tmp/dnsmasq-teamX.log
